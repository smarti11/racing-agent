<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Passi — an interactive walking audio tour of Florence’s historic center." />
    <title>Passi — Walking Tour of Florence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tour.css" />
  </head>
  <body>
    <main class="landing">
      <div class="landing__bg" aria-hidden="true"></div>
      <div class="landing__river" aria-hidden="true"></div>
      <div class="landing__content">
        <p class="brand">Passi</p>
        <h1>Walk Florence with a voice in your ear.</h1>
        <p class="landing__lede">
          Eight stops from the Duomo to Santa Croce — unlock each place as you arrive, then play the stop and read along.
        </p>
        <div class="landing__meta">
          <span>About 2 hours</span>
          <span>~3 km loop</span>
          <span>GPS + I’m here</span>
        </div>
        <div class="cta-row">
          <a class="btn btn--primary" href="tour.html">Start the walk</a>
          <a class="btn btn--ghost" href="tour.html#how">How it works</a>
        </div>
      </div>
    </main>
  </body>
</html>
