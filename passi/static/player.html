<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tour — Passi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/static/css/player.css" />
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <a href="/static/index.html">← Passi</a>
        <span class="brand-mini" id="tour-title">Loading…</span>
        <span class="session-chip" id="session-chip"></span>
      </header>
      <div class="main">
        <aside class="stops-panel">
          <h2>Stops</h2>
          <p class="hint">
            Walk within the unlock radius, or tap a stop number to unlock and play. English audio MVP.
          </p>
          <ol class="stop-list" id="stop-list"></ol>
        </aside>
        <section class="map-panel">
          <div id="map" role="application" aria-label="Tour map"></div>
          <div class="map-overlay">
            <div class="geo-status" id="geo-status">Tap Locate me for GPS, or tap a stop.</div>
            <button type="button" class="btn btn--primary btn--small" id="locate-btn">Locate me</button>
          </div>
        </section>
      </div>
      <footer class="player">
        <h2 class="player__title" id="player-title">—</h2>
        <p class="player__sub" id="player-sub">Loading tour…</p>
        <p class="walk-cue" id="walk-cue"></p>
        <div class="player__controls">
          <button type="button" class="player__btn" id="play-btn" aria-label="Play">▶</button>
          <div class="player__scrub">
            <label class="sr-only" for="scrub">Seek</label>
            <input type="range" class="player__bar" id="scrub" min="0" max="100" value="0" step="0.1" />
            <div class="player__times">
              <span id="time-cur">0:00</span>
              <span id="time-dur">0:00</span>
            </div>
          </div>
        </div>
        <div class="player__actions">
          <button type="button" class="btn btn--primary btn--small" id="im-here-btn">I’m here</button>
          <button type="button" class="btn btn--ghost btn--small" id="script-toggle">Hide script</button>
          <button type="button" class="btn btn--ghost btn--small" id="mark-done-btn">Mark heard · next</button>
        </div>
        <div class="script-drawer is-open" id="script-drawer">
          <div id="photo-gallery" class="photo-gallery" hidden></div>
          <h3>Narration script</h3>
          <p class="script-note">English guide audio — follow along as you walk.</p>
          <div id="script-body"></div>
        </div>
        <audio id="tour-audio" preload="auto" playsinline webkit-playsinline></audio>
      </footer>
    </div>
    <div class="lightbox" id="lightbox" hidden>
      <button type="button" class="btn btn--ghost btn--small lightbox__close" id="lightbox-close">Close</button>
      <img id="lightbox-img" alt="" />
      <p class="lightbox__caption" id="lightbox-caption"></p>
    </div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/static/js/player.js"></script>
  </body>
</html>
