<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" width="420" height="560">
  <title>Corner poplar shelves — elevation (left + back wall)</title>
  <style>
    .wall { fill: #e8e6e1; stroke: #9a9892; stroke-width: 2; }
    .sidewall { fill: #ddd8d0; }
    .shelf { fill: #c4a574; stroke: #6b5344; stroke-width: 1.5; }
    .cleat { fill: #b09870; stroke: #6b5344; stroke-width: 1; }
    .tank { fill: #f5f5f5; stroke: #888; stroke-width: 1.5; }
    .cabinet { fill: #f0f0f0; stroke: #aaa; stroke-width: 1; }
    .corner { stroke: #c45c26; stroke-width: 2; stroke-dasharray: 5 4; }
    .dim { fill: none; stroke: #333; stroke-width: 1; }
    .label { font-family: Georgia, serif; font-size: 11px; fill: #222; }
    .title { font-family: Georgia, serif; font-size: 13px; font-weight: bold; fill: #222; }
    .small { font-family: Georgia, serif; font-size: 9px; fill: #555; }
  </style>

  <!-- Rear wall -->
  <rect class="wall" x="70" y="20" width="280" height="500"/>
  <!-- Left wall hint (perspective strip) -->
  <polygon fill="#d8d5cf" stroke="#9a9892" stroke-width="2" points="40,40 70,20 70,520 40,500"/>

  <!-- Corner line -->
  <line class="corner" x1="70" y1="30" x2="70" y2="470"/>
  <text class="small" x="74" y="42">corner</text>

  <!-- Upper shelf from left wall, 20in = 160px at 8px/in, thick 12px -->
  <rect class="cleat" x="70" y="92" width="150" height="6"/>
  <rect class="shelf" x="70" y="80" width="160" height="12"/>
  <text class="label" x="250" y="90">Upper — left+back mount</text>

  <line class="dim" x1="55" y1="92" x2="55" y2="188"/>
  <text class="small" x="34" y="145">12&quot;</text>

  <!-- Lower shelf -->
  <rect class="cleat" x="70" y="200" width="150" height="6"/>
  <rect class="shelf" x="70" y="188" width="160" height="12"/>
  <text class="label" x="250" y="198">Lower — left+back mount</text>

  <line class="dim" x1="55" y1="200" x2="55" y2="408"/>
  <text class="small" x="30" y="310">26&quot;</text>

  <!-- Tank -->
  <rect class="tank" x="100" y="408" width="152" height="70"/>
  <text class="label" x="140" y="448">Toilet tank</text>

  <!-- Cabinet -->
  <rect class="cabinet" x="270" y="300" width="60" height="180"/>
  <text class="small" x="278" y="390">Towel</text>
  <text class="small" x="275" y="402">cabinet</text>

  <line class="dim" x1="70" y1="70" x2="230" y2="70"/>
  <text class="small" x="130" y="65">20&quot; from left wall</text>

  <text class="title" x="40" y="545">Corner shelves: attach to left wall + back wall</text>
</svg>
