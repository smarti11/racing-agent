<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280">
  <title>Shelf blank and bracket drill pattern</title>
  <style>
    .blank { fill: #d2b48c; stroke: #5c4033; stroke-width: 2; }
    .hole { fill: #2a2a2a; }
    .slot { fill: #444; }
    .label { font-family: Georgia, serif; font-size: 12px; fill: #222; }
    .small { font-family: Georgia, serif; font-size: 10px; fill: #444; }
    .dim { stroke: #333; stroke-width: 1; fill: none; }
    .note { font-family: Georgia, serif; font-size: 11px; fill: #222; }
  </style>

  <!-- Top view of shelf: 20 in L × 6 in D. Scale 1 in = 20 px ’ 400 × 120 -->
  <rect class="blank" x="40" y="40" width="400" height="120"/>

  <!-- Back edge (wall side) -->
  <text class="label" x="40" y="30">Back edge (wall)  drill blind holes per bracket kit</text>

  <!-- Example rod holes: 2 rods inset from ends, typical pattern  adjust to kit -->
  <!-- Assume rods 4 in from each end, 1 in from back, diameter ~0.5 in (10px) -->
  <circle class="hole" cx="120" cy="60" r="8"/>
  <circle class="hole" cx="360" cy="60" r="8"/>
  <text class="small" x="95" y="90">Rod A</text>
  <text class="small" x="335" y="90">Rod B</text>

  <!-- Dimensions -->
  <line class="dim" x1="40" y1="180" x2="440" y2="180"/>
  <text class="small" x="220" y="195">20.00 in length</text>

  <line class="dim" x1="460" y1="40" x2="460" y2="160"/>
  <text class="small" x="468" y="105">6.00</text>
  <text class="small" x="468" y="118">in depth</text>

  <text class="note" x="40" y="220">Thickness: 1.50 in (laminated 3/4+3/4 or milled 8/4).</text>
  <text class="note" x="40" y="238">Hole diameter, depth, and spacing MUST match your floating-bracket kit  dry-fit before finish.</text>
  <text class="note" x="40" y="256">Keep e 1.5 in solid wood behind each hole. Do not drill through the front edge.</text>
</svg>
